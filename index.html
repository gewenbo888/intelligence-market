<style>
:root{
  --void:#06120e; --abyss:#0a1c17; --deep:#0f2922; --surf:#143a2e; --rim:#1d4f3e;
  --line:rgba(197,244,50,.14); --line-strong:rgba(197,244,50,.30);
  --text:#e8f5dc; --dim:#88a392; --faint:#4d6a59;
  --bid:#74c89c; --ask:#e07578; --bond:#ffb547; --equity:#c5f432;
  --display:'DM Serif Display',serif;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--void);color:var(--text);
  font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden;
}
body.zh{font-family:'Noto Sans SC',sans-serif;}
body.zh .display{font-family:'Noto Serif SC',serif;}
.display{font-family:var(--display);letter-spacing:-.012em;font-weight:400;}
.mono{font-family:var(--mono);}
a{color:var(--equity);text-decoration:none;}
a:hover{color:var(--bond);}

.bg{position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 18% 22%,rgba(197,244,50,.04) 0%,transparent 45%),
    radial-gradient(circle at 82% 78%,rgba(255,181,71,.04) 0%,transparent 45%),
    var(--void);}
.bg::after{content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(197,244,50,.025) 1px, transparent 1px),
    linear-gradient(90deg,rgba(197,244,50,.025) 1px, transparent 1px);
  background-size:40px 40px;}

/* ─── TICKER ─── */
.ticker{position:fixed;top:0;left:0;right:0;z-index:60;
  background:var(--abyss);border-bottom:1px solid var(--line);
  padding:6px 0;overflow:hidden;font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;}
.ticker-track{display:flex;gap:36px;white-space:nowrap;animation:tickerflow 60s linear infinite;}
.ticker span{color:var(--dim);}
.ticker span b{color:var(--equity);font-weight:600;}
.ticker span .up{color:var(--bid);}
.ticker span .dn{color:var(--ask);}
@keyframes tickerflow{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ─── NAV ─── */
.nav{position:fixed;top:30px;left:0;right:0;z-index:50;
  background:rgba(6,18,14,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);}
.nav-inner{max-width:1320px;margin:0 auto;padding:14px 32px;
  display:flex;align-items:center;gap:20px;}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;}
.brand-mark{width:34px;height:34px;border-radius:6px;
  background:var(--abyss);border:1px solid var(--equity);
  display:grid;place-items:center;position:relative;}
.brand-mark svg{width:22px;height:22px;}
.brand-text{font-family:var(--display);font-size:1.22rem;font-weight:400;letter-spacing:-.005em;}
.nav-links{display:flex;gap:22px;margin-left:auto;}
.nav-links a{color:var(--dim);font-size:.82rem;font-weight:500;
  transition:color .15s;font-family:var(--mono);text-transform:lowercase;}
.nav-links a:hover{color:var(--equity);}
.lang-btn{padding:6px 14px;border:1px solid var(--line-strong);background:transparent;
  color:var(--text);border-radius:0;font-family:var(--mono);font-size:.78rem;cursor:pointer;
  transition:all .15s;letter-spacing:.06em;}
.lang-btn:hover{border-color:var(--equity);color:var(--equity);}
@media(max-width:880px){.nav-links{display:none;}}

section{padding:110px 32px;position:relative;}
.wrap{max-width:1320px;margin:0 auto;}
.eyebrow{display:inline-block;font-family:var(--mono);font-size:.74rem;
  color:var(--equity);letter-spacing:.22em;text-transform:uppercase;
  padding:5px 14px;border:1px solid var(--equity);
  margin-bottom:24px;background:rgba(197,244,50,.06);}
h1{font-family:var(--display);font-size:clamp(2.6rem,6.5vw,5.6rem);
  line-height:1.04;letter-spacing:-.02em;margin-bottom:24px;}
h1 .grad{background:linear-gradient(120deg,var(--equity) 30%,var(--bond));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
h2{font-family:var(--display);font-size:clamp(2rem,4.4vw,3.4rem);
  line-height:1.05;letter-spacing:-.015em;margin-bottom:14px;}
h3{font-family:var(--display);font-size:1.5rem;margin-bottom:8px;}
h4{font-family:var(--mono);font-size:.74rem;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;color:var(--equity);
  margin-bottom:14px;}
.lede{font-size:1.12rem;color:var(--dim);max-width:760px;line-height:1.7;}
.lede em{color:var(--bond);font-style:italic;}
.section-head{margin-bottom:48px;max-width:840px;}

/* ─── HERO ─── */
.hero{padding:170px 32px 80px;}
.hero h1{max-width:1100px;}
.hero .lede{margin-bottom:36px;font-size:1.22rem;}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;}
.btn{padding:13px 26px;border-radius:0;font-family:var(--mono);font-size:.84rem;
  font-weight:500;cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;letter-spacing:.04em;}
.btn-pri{background:var(--equity);color:var(--void);}
.btn-pri:hover{background:var(--bond);}
.btn-sec{background:transparent;border-color:var(--line-strong);color:var(--text);}
.btn-sec:hover{border-color:var(--equity);color:var(--equity);}

.market-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:60px;
  border:1px solid var(--line);background:var(--line);}
@media(max-width:740px){.market-stats{grid-template-columns:repeat(2,1fr);}}
.stat-cell{padding:22px 24px;background:var(--abyss);}
.stat-cell .lbl{font-family:var(--mono);font-size:.72rem;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;}
.stat-cell .val{font-family:var(--display);font-size:2rem;color:var(--equity);line-height:1;}
.stat-cell .dt{font-family:var(--mono);font-size:.74rem;color:var(--dim);margin-top:6px;}
.stat-cell .dt.up{color:var(--bid);}.stat-cell .dt.dn{color:var(--ask);}

/* ─── MODULE 1 — PROBLEM EXCHANGE ─── */
.exch-stage{margin-top:30px;background:var(--abyss);border:1px solid var(--line);}
.exch-head{padding:18px 24px;background:var(--deep);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.exch-head .title{font-family:var(--mono);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--equity);}
.exch-filters{display:flex;gap:6px;flex-wrap:wrap;}
.exch-filter{padding:6px 12px;background:var(--abyss);border:1px solid var(--line);
  font-family:var(--mono);font-size:.72rem;color:var(--dim);cursor:pointer;
  transition:all .15s;text-transform:uppercase;letter-spacing:.1em;}
.exch-filter.active,.exch-filter:hover{border-color:var(--equity);color:var(--equity);background:rgba(197,244,50,.06);}
.exch-table{display:flex;flex-direction:column;}
.exch-row{display:grid;grid-template-columns:60px 2fr 100px 100px 110px 90px 110px;gap:14px;
  padding:16px 24px;border-bottom:1px solid var(--line);align-items:center;
  cursor:pointer;transition:background .15s;}
.exch-row.head{background:var(--deep);font-family:var(--mono);font-size:.7rem;
  color:var(--faint);letter-spacing:.12em;text-transform:uppercase;cursor:default;}
.exch-row:hover:not(.head){background:rgba(197,244,50,.04);}
.exch-row .id{font-family:var(--mono);font-size:.78rem;color:var(--faint);}
.exch-row .topic{}
.exch-row .topic .name{font-family:var(--display);font-size:1.05rem;line-height:1.3;}
.exch-row .topic .desc{font-size:.78rem;color:var(--dim);margin-top:2px;font-style:italic;}
.exch-row .cat{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;}
.exch-row .cat.math{color:var(--bid);}.exch-row .cat.strat{color:var(--bond);}
.exch-row .cat.design{color:var(--equity);}.exch-row .cat.code{color:#7fb6e0;}
.exch-row .cat.policy{color:#c89cd6;}
.exch-row .diff{font-family:var(--mono);font-size:.78rem;color:var(--dim);}
.exch-row .bounty{font-family:var(--mono);font-size:.92rem;color:var(--equity);font-weight:600;}
.exch-row .solvers{font-family:var(--mono);font-size:.78rem;color:var(--dim);}
.exch-row .status{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;
  padding:3px 8px;border:1px solid;text-transform:uppercase;text-align:center;}
.exch-row .status.open{color:var(--equity);border-color:var(--equity);}
.exch-row .status.live{color:var(--bond);border-color:var(--bond);background:rgba(255,181,71,.06);}
.exch-row .status.closed{color:var(--dim);border-color:var(--line-strong);}
@media(max-width:880px){
  .exch-row{grid-template-columns:1fr 110px;gap:8px;}
  .exch-row > .id, .exch-row > .cat, .exch-row > .diff, .exch-row > .solvers, .exch-row > .status{display:none;}
  .exch-row.head{display:none;}
}

/* ─── MODULE 2 — SOLVER SYSTEM ─── */
.solver-stage{margin-top:30px;display:grid;grid-template-columns:1fr 1.2fr;gap:24px;}
@media(max-width:980px){.solver-stage{grid-template-columns:1fr;}}
.solver-problem{background:var(--abyss);border:1px solid var(--line);padding:30px;}
.solver-problem .id{font-family:var(--mono);font-size:.74rem;color:var(--equity);letter-spacing:.14em;}
.solver-problem h3{margin:6px 0 14px;}
.solver-problem .desc{color:var(--dim);font-size:.96rem;margin-bottom:18px;line-height:1.7;}
.solver-problem .meta-row{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--mono);font-size:.78rem;
  margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.solver-problem .meta-row span{color:var(--dim);}
.solver-problem .meta-row span b{color:var(--equity);font-weight:500;}
.solver-problem .formula{padding:14px;background:var(--deep);border:1px dashed var(--line);
  font-family:var(--mono);font-size:.86rem;color:var(--text);overflow-x:auto;}
.solver-list{background:var(--abyss);border:1px solid var(--line);padding:0;}
.solver-list-head{padding:14px 22px;background:var(--deep);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--equity);display:flex;justify-content:space-between;}
.solver-card{padding:18px 22px;border-bottom:1px solid var(--line);}
.solver-card:last-child{border-bottom:none;}
.solver-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:10px;}
.solver-card .who{display:flex;align-items:center;gap:10px;}
.solver-card .who .avatar{width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;font-weight:600;}
.solver-card.human .avatar{background:var(--bond);color:var(--void);}
.solver-card.ai .avatar{background:var(--equity);color:var(--void);}
.solver-card.team .avatar{background:linear-gradient(135deg,var(--bond),var(--equity));color:var(--void);}
.solver-card .name{font-family:var(--mono);font-size:.88rem;font-weight:500;}
.solver-card .name small{display:block;font-size:.7rem;color:var(--faint);font-weight:400;text-transform:uppercase;letter-spacing:.1em;}
.solver-card .approach{font-family:var(--display);font-size:1.05rem;color:var(--text);margin:4px 0 10px;line-height:1.4;}
.solver-card .approach-desc{font-size:.86rem;color:var(--dim);line-height:1.6;margin-bottom:12px;}
.solver-card .scores{display:grid;grid-template-columns:repeat(3,1fr) 80px;gap:10px;
  padding-top:10px;border-top:1px dashed var(--line);align-items:center;font-family:var(--mono);font-size:.78rem;}
.solver-card .score-cell .k{font-size:.66rem;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;}
.solver-card .score-cell .v{font-size:.96rem;color:var(--equity);font-weight:600;}
.solver-card .total{text-align:right;font-family:var(--display);font-size:1.6rem;color:var(--bond);line-height:1;}
.solver-card .total small{display:block;font-family:var(--mono);font-size:.66rem;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-top:2px;}

/* ─── MODULE 3 — SCORING ENGINE ─── */
.score-stage{margin-top:30px;background:var(--abyss);border:1px solid var(--line);padding:30px;}
.score-axes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
@media(max-width:780px){.score-axes{grid-template-columns:1fr;}}
.score-axis{padding:22px;background:var(--deep);border:1px solid var(--line);border-top:3px solid;}
.score-axis.correctness{border-top-color:var(--bid);}
.score-axis.elegance{border-top-color:var(--bond);}
.score-axis.efficiency{border-top-color:var(--equity);}
.score-axis .icon{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;}
.score-axis.correctness .icon{color:var(--bid);}
.score-axis.elegance .icon{color:var(--bond);}
.score-axis.efficiency .icon{color:var(--equity);}
.score-axis h4{font-family:var(--display);font-size:1.4rem;margin:6px 0 10px;color:var(--text);text-transform:none;letter-spacing:-.005em;}
.score-axis p{font-size:.9rem;color:var(--dim);line-height:1.65;margin-bottom:12px;}
.score-axis .checks{margin-left:18px;color:var(--dim);font-size:.85rem;}
.score-axis .checks li{margin-bottom:5px;}
.score-axis .formula{margin-top:14px;padding:10px 12px;background:var(--abyss);
  font-family:var(--mono);font-size:.74rem;color:var(--dim);}
.score-axis .formula b{color:var(--equity);}
.score-flow{padding:22px;background:var(--deep);border:1px solid var(--line);
  font-family:var(--mono);font-size:.88rem;color:var(--text);text-align:center;}
.score-flow b{color:var(--equity);font-weight:500;}
.score-flow .step{display:inline-block;padding:6px 12px;border:1px solid var(--equity);margin:0 4px;color:var(--equity);}
.score-flow .arrow{color:var(--bond);margin:0 6px;}

/* ─── MODULE 4 — REPUTATION ─── */
.rep-stage{margin-top:30px;background:var(--abyss);border:1px solid var(--line);}
.rep-tabs{display:flex;border-bottom:1px solid var(--line);}
.rep-tab{flex:1;padding:14px 20px;background:transparent;border:none;
  font-family:var(--mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.rep-tab.active{color:var(--equity);border-bottom-color:var(--equity);background:rgba(197,244,50,.04);}
.rep-table{display:flex;flex-direction:column;}
.rep-row{display:grid;grid-template-columns:50px 2fr 110px 100px 100px 100px 110px;gap:14px;
  padding:14px 24px;border-bottom:1px solid var(--line);align-items:center;}
.rep-row.head{background:var(--deep);font-family:var(--mono);font-size:.7rem;
  color:var(--faint);letter-spacing:.12em;text-transform:uppercase;}
.rep-row .rank{font-family:var(--display);font-size:1.6rem;color:var(--equity);}
.rep-row .rank.gold{color:var(--bond);}
.rep-row .who{display:flex;align-items:center;gap:12px;}
.rep-row .who .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:.78rem;font-weight:600;}
.rep-row.human .avatar{background:var(--bond);color:var(--void);}
.rep-row.ai .avatar{background:var(--equity);color:var(--void);}
.rep-row.team .avatar{background:linear-gradient(135deg,var(--bond),var(--equity));color:var(--void);}
.rep-row .who .info .name{font-family:var(--mono);font-weight:500;font-size:.92rem;}
.rep-row .who .info .specialty{font-family:var(--sans);font-size:.74rem;color:var(--faint);font-style:italic;}
.rep-row .num{font-family:var(--mono);font-size:.92rem;color:var(--text);text-align:right;}
.rep-row .num.score{color:var(--equity);font-weight:600;}
.rep-row .num.elo{color:var(--bond);}
.rep-row .badge{font-family:var(--mono);font-size:.7rem;text-align:center;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border:1px solid;}
.rep-row .badge.legend{color:var(--bond);border-color:var(--bond);}
.rep-row .badge.master{color:var(--equity);border-color:var(--equity);}
.rep-row .badge.expert{color:var(--bid);border-color:var(--bid);}
.rep-row .badge.adept{color:var(--dim);border-color:var(--line-strong);}
@media(max-width:880px){
  .rep-row{grid-template-columns:40px 1fr 70px;gap:10px;padding:12px 16px;}
  .rep-row > .num:nth-child(n+4):not(:last-child), .rep-row > .badge{display:none;}
  .rep-row.head{display:none;}
}

/* ─── MODULE 5 — HYBRID TEAMS ─── */
.team-stage{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:980px){.team-stage{grid-template-columns:1fr;}}
.team-card{padding:24px;background:var(--abyss);border:1px solid var(--line);
  position:relative;display:flex;flex-direction:column;}
.team-card .pattern-id{font-family:var(--mono);font-size:.7rem;color:var(--equity);letter-spacing:.18em;text-transform:uppercase;}
.team-card h4{font-family:var(--display);font-size:1.5rem;font-weight:400;margin:8px 0 6px;color:var(--text);text-transform:none;letter-spacing:-.005em;}
.team-card .signature{font-family:var(--mono);font-size:.78rem;color:var(--bond);margin-bottom:14px;}
.team-card p{font-size:.92rem;color:var(--dim);line-height:1.65;margin-bottom:14px;flex:1;}
.team-card .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);}
.team-card .role{padding:10px;background:var(--deep);border:1px solid var(--line);}
.team-card .role .who{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;}
.team-card .role.h .who{color:var(--bond);}
.team-card .role.a .who{color:var(--equity);}
.team-card .role .what{font-size:.84rem;color:var(--text);line-height:1.45;}
.team-card .lift{font-family:var(--mono);font-size:.78rem;color:var(--bid);margin-top:14px;text-align:right;}

/* ─── STRIPS ─── */
.strip{padding:74px 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--abyss),var(--void));}

            <li data-en="Test cases passed (out of N)" data-zh="通过的测试案例 (共 N 个)"></li>

          <div class="formula"><b>C</b> = <span data-en="passed / total × edge_bonus" data-zh="通过 / 总数 × 边界加权"></span></div>

          <ul class="checks">
            <li data-en="Insight density" data-zh="洞见密度"></li>
            <li data-en="Abstraction quality" data-zh="抽象质量"></li>
            <li data-en="Generalizability" data-zh="可推广性"></li>
          </ul>
          <div class="formula"><b>E</b> = <span data-en="ln(insight) − ln(complexity)" data-zh="ln(洞见) − ln(复杂度)"></span></div>
        </div>
        <div class="score-axis efficiency">
          <div class="icon" data-en="03 · EFFICIENCY" data-zh="03 · 效率"></div>

            <li data-en="Compute / tokens used" data-zh="使用的算力 / 令牌"></li>
            <li data-en="Marginal cost per insight" data-zh="每洞见的边际成本"></li>

function isZh(){ return document.body.classList.contains('zh'); }
function applyLang(lang){
  document.body.classList.toggle('zh', lang==='zh');
  localStorage.setItem('im-lang', lang);
  document.documentElement.lang = lang==='zh' ? 'zh-CN' : 'en';
  document.getElementById('lang-btn').textContent = lang==='zh' ? 'EN' : '中文';
  document.querySelectorAll('[data-en], [data-zh]').forEach(el=>{
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    const txt = lang==='zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
    if (txt != null) el.innerHTML = txt;
  });
  renderTicker(); renderExch(); renderSolverProblem(); renderSolverCards(); renderRepTabs(); renderRepTable(); renderTeams();
}
document.getElementById('lang-btn').onclick=()=>applyLang(isZh()?'en':'zh');

          <div class="who">${lang==='zh'?'人类':'HUMAN'}</div>
          <div class="what">${t.h[lang]}</div>
        </div>
        <div class="role a">
          <div class="who">AI</div>
          <div class="what">${t.a[lang]}</div>
        </div>
      </div>
      <div class="lift">${lang==='zh'?'相对单代理基线 ':'vs solo baseline '}<b>${t.lift}</b></div>
    </div>
  `).join('');
}

/* ════════════════════════ INIT ════════════════════════ */
applyLang(localStorage.getItem('im-lang') || 'en');

const io = new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting && e.target.classList.add('in')), {threshold:.12});
document.querySelectorAll('.section-head, .exch-stage, .solver-stage, .score-stage, .rep-stage, .team-stage').forEach(el=>{
  el.classList.add('fadeup'); io.observe(el);
});
</script>
</body>
</html>
